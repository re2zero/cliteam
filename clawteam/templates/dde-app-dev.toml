4. RUN INTEGRATION TESTS AND BUILD VERIFICATION:
   - Build: cmake --build build
   - Tests: ctest --output-on-failure
   - Package: dpkg-buildpackage -us -uc
   - Install: dpkg -i <package>.deb

5. GENERATE FINAL QUALITY REPORT:
   Create a comprehensive quality report containing:
